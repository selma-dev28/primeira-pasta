<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
       <p>Digite a idade:</p>
    <input type="number" name="" id="caixa">
    <p id="resultado"></p>
    <script>
        let caixa = document.querySelector("#caixa");
        caixa.addEventListener("change", function(){
            if(this.value > 17){
                document.querySelector("#resultado").textContent = this.value + ' é maior de idade'
            } else {
                document.querySelector('#resultado').textContent = this.value + ' é menor de idade'
            }
        })

    </script>
</body>
</html>
