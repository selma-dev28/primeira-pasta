<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Números</title>
</head>
<body>
    <p>Digite um número:</p>
    <input type="number" name="" id="caixa">
    <p id="resultado"></p>
    <script>
        let caixa = document.querySelector("#caixa");
        caixa.addEventListener("change", function(){
            if(this.value > 0){
                document.querySelector("#resultado").textContent = this.value + ' é positivo'
            } else if(this.value < 0){
                document.querySelector('#resultado').textContent = this.value + ' é negativo'
            } else {
                document.querySelector('#resultado').textContent = this.value + ' é neutro'
            }
        })

    </script>
</body>
</html>
